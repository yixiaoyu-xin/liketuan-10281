<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EDEDED">
<title>聊天</title>
<style>
:root{
  --gray:#EDEDED; --line:#E5E5E5; --text:#191919; --sub:#9B9B9B; --time:#B3B3B3;
  --green:#07C160; --red:#FA3B30; --ink:#1A1A1A;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);background:#e9ebef;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--text)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;border:0;outline:none;background:none;min-width:0}
.hidden{display:none!important}
.page,.list,.msg-area,.contacts-list,.sheet-body,.profile-scroll,.library-body,.emoji-grid,.card-pick{scrollbar-width:none}
.page::-webkit-scrollbar,.list::-webkit-scrollbar,.msg-area::-webkit-scrollbar,.contacts-list::-webkit-scrollbar,.sheet-body::-webkit-scrollbar,.profile-scroll::-webkit-scrollbar,.library-body::-webkit-scrollbar,.emoji-grid::-webkit-scrollbar,.card-pick::-webkit-scrollbar{display:none}

/* ---------- 手机外壳 ---------- */
.phone{width:390px;height:844px;position:relative;border-radius:44px;background:#000;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.28)}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;background:var(--gray);overflow:hidden;border-radius:44px}

/* ---------- 状态栏 ---------- */
.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:14px;font-weight:600;color:#000}
.sb-left,.sb-right{display:flex;align-items:center;gap:6px}
.sb-clock{font-variant-numeric:tabular-nums;letter-spacing:.2px}
.sb-right{gap:5px}
.sb-right .num{font-size:12.5px;font-weight:500}

/* ---------- 顶部标题栏 ---------- */
.header{height:44px;flex:0 0 44px;position:relative;display:flex;align-items:center;justify-content:center;background:var(--gray)}
.title{font-size:17px;font-weight:600;letter-spacing:.4px;font-variant-numeric:tabular-nums}
.title.live{letter-spacing:.6px}
.header-actions{position:absolute;right:14px;top:0;height:44px;display:flex;align-items:center;gap:18px}
.icon-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:var(--ink);border-radius:50%;transition:transform .15s,opacity .15s}
.icon-btn:active{transform:scale(.9);opacity:.6}
.icon-btn svg{width:25px;height:25px;display:block}
.icon-btn.active{opacity:.55}

/* ---------- 内容区 ---------- */
.content{flex:1;position:relative;background:var(--gray);overflow:hidden}
.page{position:absolute;top:0;right:0;bottom:0;left:0;overflow:auto;display:none}
.page.active{display:block}
.list{min-height:100%;background:var(--gray)}
.empty-tip{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;color:#B8B8B8;font-size:13.5px;letter-spacing:.5px}

/* ---------- 会话列表 ---------- */
.cell{position:relative;display:flex;align-items:center;height:64px;padding:8px 16px;background:#fff}
.cell::after{content:"";position:absolute;left:76px;right:0;bottom:0;height:1px;background:var(--line)}
.cell:active{background:#F2F2F2}
.cell-main{flex:1;min-width:0;margin-left:12px;padding-right:64px}
.cell-title{font-size:16px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-sub{margin-top:3px;font-size:13px;line-height:17px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell-time{position:absolute;right:16px;top:13px;font-size:11.5px;color:var(--time)}

/* ---------- 头像 ---------- */
.av{width:48px;height:48px;flex:0 0 auto;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:500}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.gav{width:48px;height:48px;flex:0 0 auto;border-radius:6px;overflow:hidden;display:flex;flex-wrap:wrap;background:#D9D9D9}
.gav>span,.gav>img{width:50%;height:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:500;object-fit:cover}
.gav-1>span,.gav-1>img{width:100%;height:100%;font-size:19px}
.gav-2>span,.gav-2>img{width:50%;height:100%}

/* ---------- 底部导航 ---------- */
.tabbar{flex:0 0 auto;background:#fff;border-top:1px solid var(--line);display:flex;padding-top:5px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#7D7D7D;padding:2px 0 0}
.tab .tab-ico{position:relative;width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.tab .tab-ico svg{width:27px;height:27px;display:block}
.tab span{font-size:10px;line-height:14px;letter-spacing:.3px}
.tab.active{color:var(--green)}
.tab .dot{position:absolute;top:1px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--red);border:1.5px solid #fff}
.home-indicator{flex:0 0 auto;background:#fff;height:20px;display:flex;align-items:flex-start;justify-content:center}
.home-indicator i{width:134px;height:5px;border-radius:3px;background:#111;opacity:.85}

/* ---------- 加号菜单 ---------- */
.mask{position:absolute;top:0;right:0;bottom:0;left:0;z-index:30;background:rgba(0,0,0,.06);opacity:0;pointer-events:none;transition:opacity .18s}
.mask.open{opacity:1;pointer-events:auto}
.menu{position:absolute;z-index:31;top:94px;right:10px;width:196px;padding:4px 0;background:rgba(48,48,48,.97);border-radius:10px;color:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.22);transform-origin:100% 0;transform:scale(.9) translateY(-8px);opacity:0;pointer-events:none;
  transition:transform .18s cubic-bezier(.2,.8,.3,1),opacity .14s}
.menu.open{transform:scale(1) translateY(0);opacity:1;pointer-events:auto}
.menu::before{content:"";position:absolute;top:-6px;right:26px;width:13px;height:13px;background:rgba(48,48,48,.97);transform:rotate(45deg);border-radius:2px}
.menu-item{width:100%;display:flex;align-items:center;gap:13px;padding:0 15px;height:50px;font-size:15.5px;letter-spacing:.3px;position:relative;text-align:left}
.menu-item+.menu-item::after{content:"";position:absolute;top:0;left:15px;right:15px;height:1px;background:rgba(255,255,255,.12)}
.menu-item svg{width:22px;height:22px;flex:0 0 22px;display:block}
.menu-item:active{background:rgba(255,255,255,.09)}

/* ---------- 底部弹层 ---------- */
.sheet-mask{position:absolute;top:0;right:0;bottom:0;left:0;z-index:55;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-mask.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:60;max-height:76%;background:#fff;border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.22,.8,.28,1);
  padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.sheet.open{transform:translateY(0)}
.sheet:not(.open){visibility:hidden;pointer-events:none}
.sheet-head{position:relative;flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line)}
.sheet-title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:600;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{font-size:15.5px;color:var(--green);padding:6px 2px;z-index:1}
.link.muted{color:#888}
.link[disabled]{color:#B9E6C9;cursor:default}
.sheet-body{flex:1;overflow:auto;overscroll-behavior:contain;padding-bottom:10px}
.sheet-empty{padding:34px 16px 26px;text-align:center;color:#9B9B9B;font-size:14px;line-height:2}
.empty-btn{display:inline-block;margin-top:8px;padding:8px 20px;border-radius:6px;background:var(--green);color:#fff;font-size:14px}

/* 选择好友 */
.pick{position:relative;display:flex;align-items:center;gap:12px;height:56px;padding:8px 16px;background:#fff}
.pick::after{content:"";position:absolute;left:68px;right:0;bottom:0;height:1px;background:var(--line)}
.pick:active{background:#F2F2F2}
.pick .av{width:40px;height:40px;font-size:15px;border-radius:5px}
.pick-name{flex:1;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1.5px solid #D0D0D0;position:relative;transition:background .15s,border-color .15s}
.check::after{content:"";position:absolute;left:6.5px;top:4.5px;width:7px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);opacity:0;transition:opacity .15s}
.pick.selected .check{background:var(--green);border-color:var(--green)}
.pick.selected .check::after{opacity:1}

/* 好友列表 */
.friend-row{position:relative;display:flex;align-items:center;gap:12px;height:60px;padding:8px 16px;background:#fff}
.friend-row::after{content:"";position:absolute;left:68px;right:0;bottom:0;height:1px;background:var(--line)}
.friend-row:active{background:#F2F2F2}
.friend-row .av{width:40px;height:40px;font-size:15px;border-radius:5px}
.friend-name{flex:1;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-edit{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#B0B0B0;border-radius:50%}
.row-edit svg{width:19px;height:19px;display:block}
.row-edit:active{background:#F0F0F0;color:#07C160}

/* 编辑好友 */
.friend-edit{padding:20px 18px 26px}
.avatar-edit{display:flex;align-items:center;gap:18px}
.avatar-preview{width:72px;height:72px;flex:0 0 auto;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px;font-weight:500}
.avatar-preview img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-tools{flex:1;min-width:0}
.avatar-label{font-size:13px;color:#9B9B9B;margin-bottom:2px}
.upload-btn{display:inline-block;font-size:14px;color:var(--green);padding:3px 0;cursor:pointer}
.swatches{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
.swatch{width:22px;height:22px;border-radius:50%;border:0}
.swatch.active{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--green)}
.field{display:flex;align-items:center;gap:10px;margin-top:24px;padding-bottom:11px;border-bottom:1px solid #EEE}
.field span{width:64px;flex:0 0 64px;font-size:15px;color:#333}
.field input{flex:1;font-size:15.5px}
.danger-btn{width:100%;margin-top:28px;padding:13px 0;border-radius:8px;background:#FBFBFB;color:#E64340;font-size:15px}
.danger-btn:active{background:#F4F4F4}

/* 字卡编辑 */
.card-edit{padding:16px 18px 26px}
.card-title-input{width:100%;padding:10px 0;font-size:16px;font-weight:600;border-bottom:1px solid #EEE}
.card-textarea{width:100%;min-height:120px;margin-top:14px;padding:11px 12px;font-size:15px;line-height:1.55;resize:none;background:#F7F7F7;border-radius:8px}

/* ---------- 整页 ---------- */
.screen-page{position:absolute;top:44px;left:0;right:0;bottom:20px;z-index:40;display:flex;flex-direction:column;background:var(--gray);
  transform:translateX(100%);transition:transform .28s cubic-bezier(.25,.8,.3,1);visibility:hidden;pointer-events:none}
.screen-page.open{transform:translateX(0);visibility:visible;pointer-events:auto}
.detail-head{position:relative;flex:0 0 46px;height:46px;display:flex;align-items:center;background:var(--gray);border-bottom:1px solid #DEDEDE}
.detail-back{width:44px;height:46px;flex:0 0 44px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.detail-back:active{opacity:.5}
.detail-back svg{width:22px;height:22px;display:block}
.detail-title{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.detail-count{font-size:14px;font-weight:400;color:#9B9B9B}

/* 字卡库 */
.library-body{flex:1;overflow:auto;background:#fff}
.card-row{position:relative;display:flex;align-items:flex-start;gap:10px;padding:13px 16px;background:#fff}
.card-row::after{content:"";position:absolute;left:16px;right:0;bottom:0;height:1px;background:var(--line)}
.card-row:active{background:#F7F7F7}
.card-main{flex:1;min-width:0}
.card-title{font-size:15.5px;font-weight:600;line-height:21px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-text{margin-top:3px;font-size:13px;line-height:18px;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-row .row-edit{margin-top:2px}
.library-empty{padding:90px 20px;text-align:center;color:#B8B8B8;font-size:14px;line-height:2}

/* 会话详情 */
.msg-area{flex:1;overflow:auto;padding:12px 12px 20px;background:var(--gray)}
.sys-tip{text-align:center;font-size:12px;color:#9E9E9E;margin:10px 0 16px}
.msg{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px}
.msg.mine{justify-content:flex-end}
.msg .bubble{max-width:66%;padding:9px 12px;border-radius:5px;background:#95EC69;font-size:15.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.msg .av{width:38px;height:38px;font-size:14px;border-radius:4px}
.msg .av.me{background:#B9B9B9}
.composer{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#F7F7F7;border-top:1px solid #E2E2E2}
.composer-plus{width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;color:#4A4A4A}
.composer-plus svg{width:25px;height:25px;display:block}
.msg-input{flex:1;height:34px;padding:0 10px;background:#fff;border-radius:4px;font-size:15px}
.send-btn{height:30px;padding:0 14px;border-radius:5px;background:var(--green);color:#fff;font-size:14px;flex:0 0 auto}
.send-btn[disabled]{opacity:.35}

/* ---------- 提示 ---------- */
.toast{position:absolute;left:50%;bottom:26%;transform:translate(-50%,6px);z-index:120;max-width:70%;padding:9px 16px;border-radius:8px;
  background:rgba(0,0,0,.78);color:#fff;font-size:13.5px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- 开场动画 ---------- */
.splash{position:absolute;top:0;right:0;bottom:0;left:0;z-index:100;background:#fff;display:flex;align-items:center;justify-content:center;border-radius:44px;transition:opacity .34s ease}
.splash.hide{opacity:0;pointer-events:none}
.splash-text{font-size:17px;letter-spacing:6px;color:#C4C4C4;opacity:0;transform:translateY(6px);animation:splashIn .7s cubic-bezier(.2,.8,.2,1) .1s forwards}
@keyframes splashIn{to{opacity:1;transform:none}}
.splash-hint{position:absolute;bottom:72px;left:0;right:0;text-align:center;font-size:11.5px;color:#D8D8D8;letter-spacing:3px}

/* ---------- 通讯录 ---------- */
#page-contacts{overflow:hidden}
.contacts-list{min-height:100%;height:100%;overflow:auto;background:#fff;padding-bottom:8px}
.contacts-tool{padding:8px 0 4px;background:#EDEDED}
.contacts-tool .tool-row{display:flex;align-items:center;height:36px;padding:0 16px;gap:8px;background:#fff;font-size:14px;color:#333}
.contacts-tool .tool-row+.tool-row{margin-top:1px}
.group-letter{position:sticky;top:0;z-index:2;height:24px;display:flex;align-items:center;padding:0 16px;background:#EDEDED;font-size:12.5px;color:#8A8A8A}
.contact-row{position:relative;display:flex;align-items:center;height:56px;padding:6px 16px;background:#fff}
.contact-row::after{content:"";position:absolute;left:68px;right:0;bottom:0;height:1px;background:var(--line)}
.contact-row:active{background:#F2F2F2}
.contact-row .av{width:40px;height:40px;border-radius:5px;font-size:15px}
.contact-name{flex:1;margin-left:12px;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.index-rail{position:absolute;right:2px;top:50%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;padding:4px 3px;font-size:10.5px;line-height:1.45;color:#6E6E6E;user-select:none}
.index-rail span{padding:0 2px}
.index-rail span:active{color:var(--green)}

/* ---------- 好友资料 ---------- */
.profile-head{background:#EDEDED}
.profile-head-actions{position:absolute;right:2px;top:0;height:46px;display:flex;align-items:center}
.profile-scroll{flex:1;overflow:auto;background:var(--gray);padding-bottom:20px}
.profile-main{display:flex;align-items:center;gap:16px;padding:22px 20px 20px;background:var(--gray)}
.profile-av{width:68px;height:68px;flex:0 0 68px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-size:25px;font-weight:500;position:relative}
.profile-av img{width:100%;height:100%;object-fit:cover;display:block}
.profile-av::after{content:"更换";position:absolute;left:0;right:0;bottom:0;padding:2px 0;font-size:10px;text-align:center;background:rgba(0,0,0,.35);color:#fff}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:20px;font-weight:600;line-height:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-region{margin-top:6px;font-size:13.5px;color:#8A8A8A;display:flex;align-items:center;gap:4px;text-align:left}
.profile-region span{color:#8A8A8A}
.profile-card{margin:9px 0 0;background:#fff}
.ps-row{position:relative;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 18px;font-size:15.5px}
.ps-row+.ps-row::before{content:"";position:absolute;top:0;left:18px;right:0;height:1px;background:var(--line)}
.chev{color:#B2B2B2;font-size:17px;line-height:1}
.ps-value{color:#9B9B9B;font-size:14.5px}
.moments-strip{display:flex;gap:8px;padding:0 18px 14px}
.moments-strip i{width:56px;height:56px;border-radius:4px;background:#E7E7E7}
.moments-strip i:nth-child(2){background:#EFE3D6}
.moments-strip i:nth-child(3){background:#DCE6EE}
.moments-strip i:nth-child(4){background:#E4E9DE}
.video-mini{padding:0 18px 14px}
.video-mini span{display:block;height:72px;border-radius:5px;background:linear-gradient(120deg,#DDE5EC,#E9E1DA 60%,#E6E9DE)}
.profile-btns{display:flex;flex-direction:column;gap:1px;margin-top:9px;background:#fff}
.profile-btns button{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;font-size:16px;color:#111;background:#fff}
.profile-btns button+button{position:relative}
.profile-btns button+button::before{content:"";position:absolute;top:0;left:18px;right:18px;height:1px;background:var(--line)}
.profile-btns button:active{background:#F2F2F2}
.profile-btns svg{width:21px;height:21px;display:block}
.profile-btns button:first-child{color:#111}

/* ---------- 设置 / 开关 / 背景 ---------- */
.setting-row{position:relative;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 18px;background:#fff;font-size:15.5px}
.setting-row+.setting-row::before{content:"";position:absolute;top:0;left:18px;right:0;height:1px;background:var(--line)}
.switch{width:46px;height:27px;flex:0 0 46px;border-radius:14px;background:#DDDDDD;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.active{background:var(--green)}
.switch.active::after{transform:translateX(19px)}
.setting-block{padding:16px 18px 18px;background:#fff;margin-top:9px}
.setting-label{font-size:14px;color:#8A8A8A;margin-bottom:12px}
.bg-swatches{display:flex;gap:14px}
.bg-swatch{width:52px;height:52px;border-radius:8px;border:1px solid #E2E2E2;position:relative}
.bg-swatch.bg-gray{background:#EDEDED}
.bg-swatch.bg-white{background:#fff}
.bg-swatch.bg-warm{background:#F4EBDC}
.bg-swatch.active{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--green)}
.danger-row{width:100%;margin-top:9px;height:54px;background:#fff;color:#E64340;font-size:15.5px}
.danger-row:active{background:#F7F7F7}
.placeholder-link{min-width:12px;pointer-events:none}
.option-row{display:flex;align-items:center;gap:12px;width:100%;height:58px;padding:0 20px;background:#fff;font-size:16px;text-align:left}
.option-row+.option-row{position:relative}
.option-row+.option-row::before{content:"";position:absolute;top:0;left:20px;right:0;height:1px;background:var(--line)}
.option-row:active{background:#F2F2F2}
.option-row svg{width:22px;height:22px;display:block;color:#111}

/* ---------- 聊天输入栏 ---------- */
.composer{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 8px;background:#F7F7F7;border-top:1px solid #E2E2E2}
.comp-btn{width:32px;height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;color:#3A3A3A;border-radius:50%}
.comp-btn:active{opacity:.55}
.comp-btn svg{width:26px;height:26px;display:block}
.comp-field{flex:1;min-width:0;display:flex;align-items:center;background:#fff;border-radius:5px;padding:0 8px;height:36px}
.msg-input{flex:1;height:36px;font-size:15px;background:transparent}
.comp-mic{width:24px;height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center;color:#8A8A8A;pointer-events:none}
.comp-mic svg{width:20px;height:20px;display:block}
.hold-talk{flex:1;height:36px;line-height:36px;text-align:center;font-size:15px;color:#333;border-radius:5px;user-select:none;-webkit-user-select:none;touch-action:none}
.hold-talk.active{background:#DEDEDE}
.send-inline{flex:0 0 auto;height:28px;padding:0 12px;border-radius:4px;background:var(--green);color:#fff;font-size:13.5px}
.send-inline[disabled]{opacity:.35}

/* ---------- 聊天面板 ---------- */
.chat-panel{flex:0 0 auto;background:#F7F7F7;border-top:1px solid #E9E9E9;overflow:hidden}
.panel-tabs{display:flex;align-items:center;gap:18px;padding:8px 16px 4px;font-size:13.5px;color:#8A8A8A}
.panel-tab.active{color:#111;font-weight:600}
.panel-manage{margin-left:auto;color:var(--green);font-size:13px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;height:214px;overflow:auto;padding:6px 14px 12px}
.emoji-grid button{height:40px;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:6px}
.emoji-grid button:active{background:#E4E4E4}
.card-pick{height:214px;overflow:auto;padding:4px 14px 12px;background:#F7F7F7}
.card-pick-item{width:100%;text-align:left;background:#fff;border-radius:8px;padding:9px 12px;margin-bottom:8px}
.card-pick-item b{display:block;font-size:14px;font-weight:600;margin-bottom:2px}
.card-pick-item span{font-size:12.5px;color:#8A8A8A;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-pick-item:active{background:#EDEDED}
.plus-panel{padding-bottom:6px}
.plus-track{display:flex;width:200%;transition:transform .26s cubic-bezier(.22,.8,.3,1)}
.plus-page{width:50%;display:grid;grid-template-columns:repeat(4,1fr);row-gap:14px;padding:16px 10px 6px}
.plus-item{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:#555}
.plus-item:active .plus-ico{background:#E2E2E2}
.plus-ico{width:54px;height:54px;border-radius:10px;background:#F2F2F2;display:flex;align-items:center;justify-content:center}
.plus-ico svg{width:27px;height:27px;display:block}
.plus-dots{display:flex;justify-content:center;gap:6px;padding:2px 0 6px}
.plus-dots i{width:6px;height:6px;border-radius:50%;background:#CFCFCF;transition:background .2s}
.plus-dots i.active{background:#7A7A7A}

/* ---------- 消息气泡 ---------- */
.msg-area{flex:1;overflow:auto;padding:10px 12px 18px;background:var(--gray);-webkit-overflow-scrolling:touch}
.msg-area.bg-gray{background:#EDEDED}
.msg-area.bg-white{background:#FFFFFF}
.msg-area.bg-warm{background:#F5EEE2}
.msg-time{text-align:center;font-size:11.5px;color:#A6A6A6;margin:6px 0 14px}
.msg{display:flex;align-items:flex-start;gap:8px;margin-bottom:16px}
.msg.mine{flex-direction:row;justify-content:flex-end}
.msg .av{width:38px;height:38px;flex:0 0 38px;font-size:14px;border-radius:4px}
.msg .av.me{background:#9AA7B4}
.msg-body{display:flex;flex-direction:column;min-width:0;max-width:70%}
.msg.mine .msg-body{align-items:flex-end}
.msg-sender{font-size:11.5px;color:#9B9B9B;margin-bottom:4px;padding-left:2px}
.msg .bubble{position:relative;max-width:100%;padding:9px 12px;border-radius:5px;background:#fff;font-size:15.5px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.msg.mine .bubble{background:#95EC69;color:#111}
.bubble.voice{display:flex;align-items:center;gap:8px;min-width:78px;padding:11px 12px;cursor:pointer}
.voice-bars{display:flex;align-items:center;gap:2px;height:14px}
.voice-bars i{width:2px;background:#4A4A4A;border-radius:1px}
.voice-bars i:nth-child(1){height:6px}
.voice-bars i:nth-child(2){height:12px}
.voice-bars i:nth-child(3){height:8px}
.msg.mine .voice-bars i{background:#2F5B22}
.voice-len{font-size:13px;color:#666}
.msg.mine .voice-len{color:#33691E}
.bubble.sticker{background:transparent!important;padding:0;font-size:56px;line-height:1.1}
.bubble.sticker.sm{font-size:22px;line-height:1.45;max-width:190px;padding:8px 12px;border-radius:8px;background:#fff!important;word-break:break-all}
.bubble.card{background:#fff!important;padding:0;border-radius:6px;overflow:hidden;min-width:170px;border:1px solid #E6E6E6}
.bubble.card .cd-title{font-size:14px;font-weight:600;color:#222;padding:8px 11px 0}
.bubble.card .cd-text{font-size:13.5px;line-height:1.5;color:#555;padding:5px 11px 11px;white-space:pre-wrap}
.call-note{display:flex;align-items:center;gap:7px;padding:9px 12px;font-size:14px;color:#555;background:#fff;border-radius:5px}
.call-note svg{width:18px;height:18px;color:#07C160}
.msg.mine .call-note{background:#95EC69;color:#2E5A1F}
.chat-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px;color:#B1B1B1;font-size:13px}
.chat-empty svg{width:76px;height:76px;opacity:.5}
#pageLibrary{z-index:46}

/* ---------- 录音提示 ---------- */
.rec-overlay{position:absolute;top:0;right:0;bottom:0;left:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.12)}
.rec-box{min-width:140px;padding:18px 20px 14px;border-radius:14px;background:rgba(0,0,0,.72);display:flex;flex-direction:column;align-items:center;gap:10px}
.rec-wave{display:flex;align-items:center;gap:3px;height:26px}
.rec-wave i{width:3px;border-radius:2px;background:#fff;animation:wave .9s ease-in-out infinite}
.rec-wave i:nth-child(1){height:8px;animation-delay:0s}
.rec-wave i:nth-child(2){height:16px;animation-delay:.1s}
.rec-wave i:nth-child(3){height:22px;animation-delay:.2s}
.rec-wave i:nth-child(4){height:12px;animation-delay:.3s}
.rec-wave i:nth-child(5){height:24px;animation-delay:.15s}
.rec-wave i:nth-child(6){height:14px;animation-delay:.25s}
.rec-wave i:nth-child(7){height:7px;animation-delay:.05s}
@keyframes wave{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}
.rec-time{font-size:13px;color:#fff;font-variant-numeric:tabular-nums}
.rec-tip{font-size:11.5px;color:rgba(255,255,255,.7)}

/* ---------- 通话 ---------- */
.call-screen{position:absolute;top:0;right:0;bottom:0;left:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:64px 0 56px;background:#2B2F33;color:#fff;opacity:0;pointer-events:none;transition:opacity .22s;overflow:hidden}
.call-screen.open{opacity:1;pointer-events:auto}
.call-bg{position:absolute;top:0;right:0;bottom:0;left:0;background:radial-gradient(120% 80% at 50% 0%,#4B5257 0%,#23272A 62%,#1B1E21 100%)}
.call-screen.video .call-bg{background:radial-gradient(130% 90% at 50% 10%,#5A6B62 0%,#33403A 55%,#1C2420 100%)}
.call-top{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:10px}
.call-avatar{width:96px;height:96px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.3)}
.call-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.call-name{font-size:19px;font-weight:600;letter-spacing:.5px}
.call-status{font-size:13.5px;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums}
.call-self{position:absolute;z-index:2;right:16px;top:76px;width:88px;height:120px;border-radius:12px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.12);display:none;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.6)}
.call-screen.video .call-self{display:flex}
.call-controls{position:relative;z-index:2;display:flex;align-items:flex-end;gap:26px}
.call-btn{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;color:rgba(255,255,255,.8)}
.call-circle{width:58px;height:58px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;transition:background .15s}
.call-circle svg{width:25px;height:25px;display:block}
.call-btn:active .call-circle{background:rgba(255,255,255,.28)}
.call-btn.hangup .call-circle{background:#F04C4C}
.call-btn.active .call-circle{background:#fff}
.call-btn.active .call-circle svg{stroke:#111}
.call-btn.active{color:#fff}
.call-screen:not(.video) .call-btn[data-callbtn="flip"]{display:none}

/* ---------- 小屏：铺满屏幕 ---------- */
@media (max-width:520px){
  body{display:block;background:#fff}
  .phone{width:100%;height:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;background:transparent}
  .screen{border-radius:0}
  .splash{border-radius:0}
}

/* ---------- 字卡库增强 ---------- */
.lib-head-actions{display:flex;align-items:center;gap:14px}
.lib-search{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:7px 14px;background:#F2F2F2;border-bottom:1px solid var(--line)}
.lib-search input{flex:1;height:32px;padding:0 12px;background:#fff;border-radius:6px;font-size:14px}
.lib-search-clear{width:22px;height:22px;border-radius:50%;background:#C8C8C8;color:#fff;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.lib-filter{flex:0 0 auto;display:flex;gap:7px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.lib-filter::-webkit-scrollbar{display:none}
.lib-filter .chip{flex:0 0 auto;padding:4px 12px;border-radius:12px;font-size:12.5px;background:#F2F2F2;color:#666;border:1px solid transparent;white-space:nowrap}
.lib-filter .chip.active{background:#E8F7EE;color:var(--green);border-color:#B7E4C6}
.lib-filter .chip.disabled{opacity:.45}

.lib-batch-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#FAFAFA;border-top:1px solid var(--line)}

.lib-batch-actions{display:flex;gap:14px}
.lib-batch-actions button{font-size:13.5px;color:#333}
.lib-batch-actions button.danger{color:#FA3B30}

.lib-tools{flex:0 0 auto;display:flex;gap:6px;padding:8px 10px 10px;background:#F7F7F7;border-top:1px solid var(--line);flex-wrap:wrap}
.lib-tools button{flex:1 1 30%;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 4px;font-size:12px;color:#444;background:#fff;border-radius:8px;border:1px solid #EAEAEA}
.lib-tools button:active{background:#F0F0F0}
.lib-tools button svg{width:15px;height:15px}

.card-row.disabled .card-main{opacity:.45}
.card-row.disabled .card-title{text-decoration:line-through}
.card-badge{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:10px;font-size:10.5px;margin-top:5px;border:1px solid}
.card-row.batch .card-check{width:20px;height:20px;border-radius:50%;border:1.5px solid #C8C8C8;flex:0 0 20px;align-self:center;margin-right:4px;display:flex;align-items:center;justify-content:center}
.card-row.batch.selected .card-check{background:var(--green);border-color:var(--green)}
.card-row.batch.selected .card-check::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}

/* 分组选择 chips（卡片编辑） */
.card-group-pick{margin-top:14px}
.cg-label{display:block;font-size:13px;color:#8A8A8A;margin-bottom:8px}
.cg-chips{display:flex;flex-wrap:wrap;gap:7px}
.cg-chips .chip{padding:5px 12px;border-radius:14px;font-size:13px;background:#F2F2F2;color:#555;border:1px solid transparent}
.cg-chips .chip.active{background:#E8F7EE;color:var(--green);border-color:#B7E4C6}
.cg-chips .chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* 分组管理列表 */
.gm-row{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.gm-dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
.gm-name{flex:1;font-size:15px;font-weight:600}
.gm-count{font-size:12px;color:#9B9B9B}
.gm-row .gm-actions{display:flex;gap:8px}
.gm-row .gm-actions button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#888}
.gm-row .gm-actions button.danger{color:#FA3B30;border-color:rgba(250,59,48,.25)}
.gm-row.disabled .gm-name{opacity:.5}
.gm-empty{padding:40px 16px;text-align:center;color:#B8B8B8;font-size:14px;line-height:1.8}

/* 字卡选择面板分组筛选 */
.card-pick-filter{display:flex;gap:6px;padding:8px 10px 4px;overflow-x:auto;scrollbar-width:none}
.card-pick-filter::-webkit-scrollbar{display:none}
.card-pick-filter .chip{flex:0 0 auto;padding:3px 10px;border-radius:11px;font-size:12px;background:#EAEAEA;color:#666;border:1px solid transparent}
.card-pick-filter .chip.active{background:#E8F7EE;color:var(--green)}
.card-pick-list{height:182px;overflow:auto;padding:2px 14px 12px}

/* ---------- 标题状态 / 正在输入 ---------- */
.chat-status{flex:0 0 auto;max-width:96px;padding:1px 6px;border-radius:9px;background:rgba(0,0,0,.05);font-size:11px;font-weight:400;line-height:16px;color:#8A8A8A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- 对方消息气泡（镜像：头像在左） ---------- */
.msg.their{flex-direction:row}
.msg.their .bubble{background:#fff;color:#111}
.msg.their .call-note{background:#fff;color:#555}
.msg.their .av{background:#9AA7B4}
.msg .av[data-uid]{cursor:pointer}
.msg .av[data-uid]:active{opacity:.65}
.msg-time em{font-style:normal;font-size:10.5px;color:#9C9C9C;margin-left:6px;letter-spacing:.2px}

/* ---------- 表情库 ---------- */
.emoji-lib-bar{display:flex;gap:6px;padding:6px 14px 0;overflow-x:auto;scrollbar-width:none}
.emoji-lib-bar::-webkit-scrollbar{display:none}
.emoji-lib-bar .chip{flex:0 0 auto;padding:3px 10px;border-radius:11px;font-size:12px;background:#EAEAEA;color:#666;border:1px solid transparent;white-space:nowrap}
.emoji-lib-bar .chip.active{background:#E8F7EE;color:var(--green)}
.emoji-lib-bar .chip.add{color:var(--green);background:#fff;border-color:#DCDCDC}
.emoji-grid{height:198px}
.emoji-empty{padding:42px 16px;text-align:center;color:#B8B8B8;font-size:13.5px;line-height:1.9}
.emoji-mgr-row{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line)}
.emoji-mgr-row:active{background:#F7F7F7}
.emoji-mgr-ico{width:34px;height:34px;border-radius:8px;background:#F2F2F2;display:flex;align-items:center;justify-content:center;font-size:19px;flex:0 0 34px;overflow:hidden}
.emoji-mgr-name{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emoji-mgr-count{font-size:12px;color:#9B9B9B}
.emoji-mgr-badge{font-size:10.5px;color:#8A8A8A;background:#F2F2F2;padding:1px 6px;border-radius:8px}
.emoji-textarea{min-height:150px}
.emoji-import-row{margin-top:10px}
.emoji-grid.img-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;padding:6px 10px 12px;align-content:start}
.emoji-grid.img-grid .eg-img{height:auto;flex-direction:column;gap:3px;padding:2px;border-radius:8px;background:transparent}
.emoji-grid.img-grid .eg-img img{width:62px;height:62px;object-fit:contain;display:block}
.emoji-grid.img-grid .eg-img span{font-size:11px;color:#666;line-height:14px;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emoji-mgr-ico img{width:100%;height:100%;object-fit:contain}
.emoji-img-list{margin-top:6px;display:flex;flex-direction:column;gap:8px;max-height:232px;overflow:auto}
.emoji-img-row{display:flex;align-items:center;gap:10px;background:#F7F7F7;border-radius:10px;padding:8px 10px}
.emoji-img-row img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:#fff;flex:0 0 44px}
.emoji-img-name{flex:1;min-width:0;background:#fff;border-radius:8px;padding:7px 10px;font-size:14px}
.emoji-img-del{flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#E8E8E8;color:#777;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
.emoji-img-del:active{background:#DDD}
.emoji-img-empty{padding:14px 0;text-align:center;color:#B8B8B8;font-size:13px}
.bubble.sticker.pic{padding:0!important;background:transparent!important;overflow:visible}
.bubble.sticker.pic img{width:120px;max-width:44vw;height:auto;display:block;border-radius:6px}
#pageProfile{z-index:47}

/* ---------- 全局设置 ---------- */
.delay-row{display:flex;align-items:center;gap:8px}
.delay-field{flex:1;display:flex;flex-direction:column;gap:4px}
.delay-field label{font-size:12px;color:#9B9B9B}
.delay-field input{width:100%;padding:9px 10px;background:#F7F7F7;border-radius:8px;font-size:14px;text-align:center;-moz-appearance:textfield}
.delay-field input::-webkit-outer-spin-button,.delay-field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.delay-sep{color:#9B9B9B;font-size:16px;margin-top:16px}
.delay-presets{display:flex;gap:8px;margin-top:12px}
.delay-presets button{flex:1;padding:7px 0;font-size:12.5px;color:#555;background:#F2F2F2;border-radius:7px}
.delay-presets button:active{background:#E4E4E4}
.setting-desc{font-size:12.5px;line-height:1.6;color:#8A8A8A}

.switch{width:44px;height:26px;border-radius:13px;background:#E5E5E5;position:relative;transition:background .2s;flex:0 0 44px}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.active{background:var(--green)}
.switch.active::after{transform:translateX(18px)}

</style>

<body>
<div class="phone" id="phone">
  <div class="screen" id="screen">

    <!-- 状态栏 -->
    <div class="statusbar">
      <div class="sb-left"><span class="sb-clock" id="sbClock">00:00</span></div>
      <div class="sb-right">
        <span class="num">5G</span>
        <svg width="18" height="12" viewBox="0 0 18 12" fill="#000"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3.6" width="3" height="8.4" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/></svg>
        <span class="num" id="batteryNum">77</span>
        <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.7" y="0.7" width="22.4" height="11.6" rx="3.4" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1.2"/><rect x="2.6" y="2.6" width="18.6" height="7.8" rx="2" fill="#000"/><path d="M24.6 4.4v4.2c.9-.3 1.5-1.1 1.5-2.1s-.6-1.8-1.5-2.1z" fill="#000" fill-opacity=".4"/></svg>
      </div>
    </div>

    <!-- 标题栏 -->
    <div class="header">
      <div class="title live" id="title">00:00</div>
      <div class="header-actions" id="headerActions">
        <button class="icon-btn" id="btnSearch" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="10.6" cy="10.6" r="6.3"/><path d="M15.4 15.4 20 20"/></svg>
        </button>
        <button class="icon-btn" id="btnPlus" aria-label="更多">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10.2"/><path d="M12 7v10M7 12h10" stroke-linecap="round"/></svg>
        </button>

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function initial(name) { var n = (name || '').trim(); return n ? n.charAt(0) : '友'; }
  function fmtListTime(ts) {
    var d = new Date(ts), n = new Date();
    if (d.toDateString() === n.toDateString()) return pad(d.getHours()) + ':' + pad(d.getMinutes());
    var y = new Date(n.getTime() - 86400000);
    if (d.toDateString() === y.toDateString()) return '昨天';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function msgTimeHTML(ts) {
    var d = new Date(ts), n = new Date();
    var hm = pad(d.getHours()) + ':' + pad(d.getMinutes());
    var y = new Date(n.getTime() - 86400000);
    var main = d.toDateString() === y.toDateString() ? '昨天 ' + hm : hm;
    var date = (d.getMonth() + 1) + '月' + d.getDate() + '日';
    return '<div class="msg-time">' + main + '<em>' + date + '</em></div>';
  }
  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec));
    return pad(Math.floor(sec / 60)) + ':' + pad(sec % 60);
  }
  function collate(a, b) {
    if (COLL) return COLL.compare(a, b);
    try { return String(a).localeCompare(String(b), 'zh-Hans-CN'); }
    catch (e) { return 0; }
  }
  function letterOf(name) {
    var c = (name || '').trim().charAt(0);
    if (!c) return '#';
    if (/[A-Za-z]/.test(c)) return c.toUpperCase();
    if (!/[\u4e00-\u9fa5]/.test(c)) return '#';
    var lo = 0, hi = BOUNDS.length - 1, res = '#';
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (collate(BOUNDS[mid], c) <= 0) {
        res = LETTERS[mid];
        lo = mid + 1;
      } else {
        hi = mid - 1;
      }
    }
    return res;
  }

  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1600);
  }

  function avatarHTML(f, uid) {
    var attr = uid ? ' data-uid="' + uid + '"' : '';
    if (f && f.avatar) return '<div class="av"' + attr + '><img src="' + f.avatar + '" alt=""></div>';
    return '<div class="av"' + attr + ' style="background:' + ((f && f.color) || '#07C160') + '">' + esc(initial(f && f.name)) + '</div>';
  }

  function groupAvatarHTML(g) {
    var members = g.memberIds.map(friendById).filter(Boolean).slice(0, 4);
    if (!members.length) return '<div class="gav gav-1"><span style="background:#C9C9C9">群</span></div>';
    return '<div class="gav gav-' + members.length + '">' + members.map(function (m) {
      if (m.avatar) return '<img src="' + m.avatar + '" alt="">';
      return '<span style="background:' + (m.color || '#07C160') + '">' + esc(initial(m.name)) + '</span>';
    }).join('') + '</div>';
  }

  function groupName(members) {
    var names = members.map(function (m) { return m.name; });
    if (names.length === 1) return names[0];
    if (names.length <= 3) return names.join('、');
    return names.slice(0, 2).join('、') + '等' + names.length + '人';
  }

  function shrinkImage(file, cb) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var size = 160;
      var canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      var ctx = canvas.getContext('2d');
      var side = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
      URL.revokeObjectURL(url);
      cb(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  function copyText(text) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        toast('已复制到剪贴板');
      } catch (e) {
        toast('复制失败');
      }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制到剪贴板'); }, fallback);
    } else {
      fallback();
    }
  }

  /* ================= 时间 ================= */
  function renderClock() {
    var d = new Date();
    var t = pad(d.getHours()) + ':' + pad(d.getMinutes());
    $('#sbClock').textContent = t;
    if (activeTab === 'chat') {
      var title = $('#title');
      if (!title.classList.contains('live')) title.classList.add('live');
      title.textContent = t;
    }
  }
  function clockLoop() {
    renderClock();
    setTimeout(clockLoop, 1000 - (Date.now() % 1000));
  }

  /* ================= 菜单 / 页面切换 ================= */
  function openMenu() {
    $('#plusMenu').classList.add('open');
    $('#mask').classList.add('open');
    $('#btnPlus').classList.add('active');
  }
  function closeMenu() {
    $('#plusMenu').classList.remove('open');
    $('#mask').classList.remove('open');
    $('#btnPlus').classList.remove('active');
  }

  function switchTab(key) {
    activeTab = key;
    $$('.tab').forEach(function (t) { t.classList.toggle('active', t.dataset.tab === key); });
    closeMenu();
    $('#page-chat').classList.toggle('active', key === 'chat');
    $('#page-contacts').classList.toggle('active', key === 'contacts');
    $('#page-other').classList.toggle('active', key !== 'chat' && key !== 'contacts');
    var title = $('#title');
    if (key === 'chat') {
      renderClock();
    } else {
      title.classList.remove('live');
      title.textContent = NAMES[key];
    }
    if (key === 'contacts') renderContacts();
    if (key !== 'chat' && key !== 'contacts') $('#otherTip').textContent = NAMES[key] + ' 页面待实现';
  }

  function openScreen(id) {
    closeSheets();
    var el = document.getElementById(id);
    el.classList.add('open');
    el.setAttribute('aria-hidden', 'false');
  }
  function closeScreen(id) {
    var el = document.getElementById(id);
    el.classList.remove('open');
    el.setAttribute('aria-hidden', 'true');
  }

  function openSheet(id) {
    closeSheets();
    closeMenu();
    var el = document.getElementById(id);
    el.classList.add('open');
    el.setAttribute('aria-hidden', 'false');
    $('#sheetMask').classList.add('open');
  }
  function closeSheets() {
    $$('.sheet.open').forEach(function (s) {
      s.classList.remove('open');
      s.setAttribute('aria-hidden', 'true');
    });
    $('#sheetMask').classList.remove('open');
  }

  /* ================= 好友 ================= */
  function openFriendsSheet() {
    renderFriendsSheet();
    openSheet('sheetFriends');
  }

  function renderFriendsSheet() {
    var box = $('#friendList');
    if (!DB.friends.length) {
      box.innerHTML = '<div class="sheet-empty">还没有好友<br>点右上角「添加」创建</div>';
      return;
    }
    box.innerHTML = DB.friends.map(function (f) {
      return '<div class="friend-row" data-fid="' + f.id + '">' + avatarHTML(f) +
        '<div class="friend-name">' + esc(f.name) + '</div>' +
        '<button class="row-edit" aria-label="编辑">' + PENCIL + '</button></div>';
    }).join('');
  }

  function openFriendEdit(f) {
    editingMe = false;
    editingFriend = f
      ? { id: f.id, name: f.name, avatar: f.avatar || null, color: f.color || PRESETS[0], region: f.region || '' }
      : { id: null, name: '', avatar: null, color: PRESETS[0], region: '' };

    $('#friendRegion').value = editingFriend.region;

    openSheet('sheetFriendEdit');

  function openMyEdit() {
    editingMe = true;
    editingFriend = {
      id: null,
      name: DB.me.name,
      avatar: DB.me.avatar || null,
      color: DB.me.color || PRESETS[0],
      region: DB.me.region || ''
    };
    $('#friendEditTitle').textContent = '编辑我的资料';
    $('#friendName').value = editingFriend.name;
    $('#friendRegion').value = editingFriend.region;
    $('#friendDelete').classList.add('hidden');
    renderAvatarEditor();
    openSheet('sheetFriendEdit');

  function renderAvatarEditor() {
    var box = $('#avatarPreview');
    if (editingFriend.avatar) {
      box.style.background = 'transparent';
      box.innerHTML = '<img src="' + editingFriend.avatar + '" alt="">';
    } else {
      box.style.background = editingFriend.color;
      box.textContent = initial(editingFriend.name);
    }
    $('#swatches').innerHTML = PRESETS.map(function (c) {
      var active = (!editingFriend.avatar && c === editingFriend.color) ? ' active' : '';
      return '<button class="swatch' + active + '" style="background:' + c + '" data-color="' + c + '" aria-label="颜色"></button>';
    }).join('');

  function saveFriend() {
    var name = $('#friendName').value.trim();
    if (!name) {
      toast(editingMe ? '请输入昵称' : '请输入好友昵称');
      $('#friendName').focus();
      return;
    }
    var region = $('#friendRegion').value.trim();
    if (editingMe) {
      DB.me.name = name;
      DB.me.avatar = editingFriend.avatar;
      DB.me.color = editingFriend.color;
      DB.me.region = region;
      saveDB();
      closeSheets();
      renderProfile();
      renderMessages();
      toast('已保存');
      return;
    }
    if (editingFriend.id) {
      var f = friendById(editingFriend.id);
      if (f) {
        f.name = name;
        f.avatar = editingFriend.avatar;
        f.color = editingFriend.color;
        f.region = region;
        DB.groups.forEach(function (g) {
          if (g.memberIds.length === 1 && g.memberIds[0] === f.id) g.name = name;
        });
      }
    } else {
      DB.friends.push({
        id: uid('f_'),
        name: name,
        avatar: editingFriend.avatar,
        color: editingFriend.color,
        region: region,
        createdAt: Date.now()
      });
    }
    saveDB();
    closeSheets();
    renderChatList();
    renderContacts();
    renderProfile();
    toast('已保存');
  }

  function deleteFriend() {
    if (editingMe || !editingFriend || !editingFriend.id) return;
    if (!confirm('删除好友「' + editingFriend.name + '」？')) return;
    var fid = editingFriend.id;
    DB.friends = DB.friends.filter(function (f) { return f.id !== fid; });
    DB.groups = DB.groups.filter(function (g) {
      g.memberIds = g.memberIds.filter(function (id) { return id !== fid; });
      return g.memberIds.length > 0;
    });
    saveDB();
    closeSheets();
    closeScreen('pageProfile');
    renderChatList();
    renderContacts();
    toast('已删除');
  }

  /* ================= 发起群聊 ================= */
  function openGroupSheet() {
    selected = {};
    renderGroupSheet();
    openSheet('sheetGroup');
  }

  function renderGroupSheet() {
    var box = $('#groupList');
    if (!DB.friends.length) {
      box.innerHTML = '<div class="sheet-empty">还没有好友，先添加好友<br><button class="empty-btn" id="emptyAddFriend">去添加好友</button></div>';
    } else {
      box.innerHTML = DB.friends.map(function (f) {
        var on = selected[f.id] ? ' selected' : '';
        return '<div class="pick' + on + '" data-fid="' + f.id + '">' + avatarHTML(f) +
          '<div class="pick-name">' + esc(f.name) + '</div><span class="check"></span></div>';
      }).join('');
    }
    $('#groupDone').disabled = !Object.keys(selected).length;
  }

  function createGroupFromSelection() {
    var members = Object.keys(selected).map(friendById).filter(Boolean);
    if (!members.length) return;
    var group;
    if (members.length === 1) {
      group = groupById(findOrCreateSingle(members[0].id));
    } else {
      group = {
        id: uid('g_'),
        name: groupName(members),
        memberIds: members.map(function (m) { return m.id; }),
        createdAt: Date.now(),
        messages: [],
        pinned: false,
        muted: false,
        bg: 'gray'
      };
      DB.groups.unshift(group);
      saveDB();
    }
    closeSheets();
    renderChatList();
    if (group) openChat(group.id);
  }

  /* ================= 通讯录 ================= */
  function renderContacts() {
    var box = $('#contactsList');
    var byLetter = {};
    DB.friends.forEach(function (f) {
      var l = letterOf(f.name);
      (byLetter[l] = byLetter[l] || []).push(f);
    });
    var letters = Object.keys(byLetter).sort(function (a, b) {
      if (a === '#') return 1;
      if (b === '#') return -1;
      return a < b ? -1 : 1;
    });
    letters.forEach(function (l) {
      byLetter[l].sort(function (a, b) { return collate(a.name, b.name); });
    });
    var html = '<div class="contacts-tool">' +
      '<div class="tool-row" id="newFriendRow">' +
      '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#FE9C1E" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="8.6" r="3.6"/><path d="M3.6 19.4c.5-3.3 3-5.4 6.4-5.4 1 0 1.8.2 2.6.6"/><path d="M18 12.6v6M15 15.6h6"/></svg>' +
      '<span>新的朋友</span></div></div>';
    letters.forEach(function (l) {
      html += '<div class="group-letter" id="grp-' + l + '">' + l + '</div>';
      byLetter[l].forEach(function (f) {
        html += '<div class="contact-row" data-fid="' + f.id + '">' + avatarHTML(f) +
          '<div class="contact-name">' + esc(f.name) + '</div></div>';
      });
    });
    if (!DB.friends.length) html += '<div class="library-empty">还没有好友<br>点右上角「+」添加朋友</div>';
    box.innerHTML = html;

    var rail = $('#indexRail');
    if (!letters.length) {
      rail.innerHTML = '';
      rail.classList.add('hidden');
    } else {
      rail.classList.remove('hidden');
      rail.innerHTML = letters.map(function (l) {
        return '<span data-letter="' + l + '">' + l + '</span>';
      }).join('');
    }
  }

  function openProfile(fid) {
    var f = friendById(fid);
    if (!f) return;
    profileIsMe = false;
    activeFriendId = fid;
    renderProfile();
    openScreen('pageProfile');
  }

  function openMyProfile() {
    profileIsMe = true;
    activeFriendId = null;
    renderProfile();
    openScreen('pageProfile');
  }

  function renderProfile() {
    var f = profileIsMe ? DB.me : friendById(activeFriendId);
    if (!f) return;
    $('#profileName').textContent = f.name;
    $('#profileRegion').textContent = f.region || '未设置';
    var av = $('#profileAvatar');
    if (f.avatar) {
      av.style.background = 'transparent';
      av.innerHTML = '<img src="' + f.avatar + '" alt="">';
    } else {
      av.style.background = f.color || '#07C160';
      av.innerHTML = esc(initial(f.name));
    }
    $('#profileChat').classList.toggle('hidden', profileIsMe);
    $('#profileCall').classList.toggle('hidden', profileIsMe);

  function openRegionSheet() {
    var f = profileIsMe ? DB.me : friendById(activeFriendId);
    if (!f) return;
    $('#regionInput').value = f.region || '';
    openSheet('sheetRegion');
    setTimeout(function () { $('#regionInput').focus(); }, 260);
  }

  function saveRegion() {
    var f = profileIsMe ? DB.me : friendById(activeFriendId);
    if (!f) return;
    f.region = $('#regionInput').value.trim();
    saveDB();
    renderProfile();
    closeSheets();
    toast('地区已更新');
  }

  function findOrCreateSingle(fid) {
    var f = friendById(fid);
    var g = DB.groups.filter(function (x) {
      return x.memberIds.length === 1 && x.memberIds[0] === fid;
    })[0];
    if (!g) {
      g = {
        id: uid('g_'),
        name: f ? f.name : '聊天',
        memberIds: [fid],
        createdAt: Date.now(),
        messages: [],
        pinned: false,
        muted: false,
        bg: 'gray'
      };
      DB.groups.unshift(g);
      saveDB();
    }
    return g.id;
  }

  /* ================= 会话列表 ================= */
  function sortedGroups() {
    return DB.groups.slice().sort(function (a, b) {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      var la = a.messages.length ? a.messages[a.messages.length - 1].ts : a.createdAt;
      var lb = b.messages.length ? b.messages[b.messages.length - 1].ts : b.createdAt;
      return lb - la;
    });
  }

  function previewOf(m) {
    if (!m) return '';
    if (m.type === 'voice') return '[语音] ' + (m.dur || 1) + '"';
    if (m.type === 'sticker') return '[动画表情]';
    if (m.type === 'card') return '[字卡] ' + (m.title || m.text || '');
    if (m.type === 'call') return m.text;
    return m.text;
  }

  function renderChatList() {
    var list = $('#chatList');
    var groups = sortedGroups();
    if (!groups.length) {
      list.innerHTML = '<div class="library-empty">还没有聊天<br>点右上角「+」「发起群聊」开始</div>';
      return;
    }
    list.innerHTML = groups.map(function (g) {
      var last = g.messages[g.messages.length - 1];
      var sub = last ? previewOf(last) : g.memberIds.length + ' 人';
      return '<div class="cell" data-gid="' + g.id + '">' + groupAvatarHTML(g) +
        '<div class="cell-main"><div class="cell-title">' + (g.muted ? '<span class="muted-ico">🔕</span> ' : '') + esc(g.name) + '</div>' +
        '<div class="cell-sub">' + esc(sub) + '</div></div>' +
        '<div class="cell-time">' + (last ? fmtListTime(last.ts) : '') + '</div></div>';
    }).join('');
  }

  /* ================= 聊天详情 ================= */
  function openChat(id) {
    var g = groupById(id);
    if (!g) return;
    if (replyTimer) { clearTimeout(replyTimer); replyTimer = null; }
    hideTyping();
    activeGroupId = id;
    typingOn = false;
    updateChatHeader();
    $('#msgInput').value = '';
    setVoiceMode(false);
    closePanels();
    updateSendState();
    applyBg(g.bg);
    renderMessages();
    openScreen('pageChatDetail');
    setTimeout(scrollMessages, 80);
  }

  function applyBg(bg) {
    var area = $('#msgArea');
    area.classList.remove('bg-gray', 'bg-white', 'bg-warm');
    area.classList.add('bg-' + (bg || 'gray'));
  }

  function renderMessages() {
    var g = groupById(activeGroupId);
    if (!g) return;
    var area = $('#msgArea');
    if (!g.messages.length) {
      area.innerHTML = '<div class="chat-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M20.5 4.5H3.5c-.6 0-1 .4-1 1v9c0 .6.4 1 1 1h6.7l3.6 3.4v-3.4h6.7c.6 0 1-.4 1-1v-9c0-.6-.4-1-1-1z"/></svg><div>打个招呼吧</div></div>';
      return;
    }
    var html = '', prev = 0;
    g.messages.forEach(function (m) {
      if (m.ts - prev > 5 * 60 * 1000) html += msgTimeHTML(m.ts);
      prev = m.ts;
      html += bubbleHTML(m);
    });
    area.innerHTML = html;
  }

  function bubbleHTML(m) {
    var inner;
    if (m.type === 'voice') {
      inner = '<div class="bubble voice" data-play="1"><span class="voice-bars"><i></i><i></i><i></i></span><span class="voice-len">' + (m.dur || 1) + '"</span></div>';
    } else if (m.type === 'sticker') {
      if (m.sticker) {
        inner = '<div class="bubble sticker pic"><img src="' + m.sticker + '" alt=""></div>';
      } else {
        var long = Array.from(String(m.text || '')).length > 2;
        inner = '<div class="bubble sticker' + (long ? ' sm' : '') + '">' + esc(m.text) + '</div>';
      }
    } else if (m.type === 'card') {
      inner = '<div class="bubble card"><div class="cd-title">' + esc(m.title || '字卡') + '</div><div class="cd-text">' + esc(m.text) + '</div></div>';
    } else if (m.type === 'call') {
      inner = '<div class="call-note">' + PHONE_ICO + '<span>' + esc(m.text) + '</span></div>';
    } else {
      inner = '<div class="bubble">' + esc(m.text) + '</div>';
    }
    var mine = m.mine !== false;
    var cls = mine ? 'mine' : 'their';
    var av;
    if (mine) {
      av = avatarHTML(DB.me, '__me__');
    } else {
      var f = (m.senderId ? friendById(m.senderId) : null) || singleFriend() || { name: '友', color: '#9AA7B4' };
      av = avatarHTML(f, f.id || '');
    }
    var body = '<div class="msg-body">' + inner + '</div>';
    return '<div class="msg ' + cls + '" data-mid="' + m.id + '">' + (mine ? body + av : av + body) + '</div>';
  }

  function updateChatHeader() {
    var g = groupById(activeGroupId);
    if (!g) return;
    $('#chatTitle').textContent = typingOn ? '对方正在输入…' : g.name;
    $('#chatCount').textContent = g.memberIds.length > 1 ? '(' + g.memberIds.length + ')' : '';
    var st = $('#chatStatus');
    var f = g.memberIds.length === 1 ? friendById(g.memberIds[0]) : null;
    if (f && f.status) {
      st.textContent = f.status;
      st.classList.remove('hidden');
    } else {
      st.classList.add('hidden');
    }
  }

  function singleFriend() {
    var g = groupById(activeGroupId);
    if (!g || g.memberIds.length !== 1) return null;
    return friendById(g.memberIds[0]);
  }

  function scrollMessages() {
    var area = $('#msgArea');
    area.scrollTop = area.scrollHeight;
  }

  function updateSendState() {
    var has = !!$('#msgInput').value.trim();
    $('#sendBtn').classList.toggle('hidden', !has);
    $('#compMic').classList.toggle('hidden', has);
    $('#sendBtn').disabled = !has;
  }

  function sendMsg(m) {
    var g = groupById(activeGroupId);
    if (!g) return;
    m.id = m.id || uid('m_');
    m.ts = m.ts || Date.now();
    if (typeof m.mine !== 'boolean') m.mine = true;
    g.messages.push(m);
    saveDB();
    renderMessages();

  function triggerAutoReply() {
    var g = groupById(activeGroupId);
    if (!g || g.memberIds.length !== 1) return;
    var f = friendById(g.memberIds[0]);
    if (!f || !f.autoReply) return;
    var pool = getReplyPool();
    if (!pool.length) return;

    if (replyTimer) { clearTimeout(replyTimer); replyTimer = null; }
    hideTyping();

    if (DB.settings.typingIndicatorEnabled) showTyping(f);

    var range = Math.max(0, DB.settings.replyDelayMax - DB.settings.replyDelayMin);
    var delay = DB.settings.replyDelayMin + Math.random() * range;
    replyTimer = setTimeout(function () {
      replyTimer = null;
      hideTyping();
      var card = pool[Math.floor(Math.random() * pool.length)];
      var g2 = groupById(activeGroupId);
      if (!g2) return;
      g2.messages.push({
        id: uid('m_'),
        type: 'text',
        text: card.content,
        ts: Date.now(),
        mine: false,
        senderId: f.id
      });
      saveDB();
      renderMessages();
      renderChatList();
      scrollMessages();
    }, delay);
  }

  function tickStatuses() {
    var now = Date.now();
    var changed = false, activeChanged = false;
    var g = groupById(activeGroupId);
    var activeFid = g && g.memberIds.length === 1 ? g.memberIds[0] : null;
    DB.friends.forEach(function (f) {
      if (now - f.statusAt >= f.statusNext * 3600000) {
        f.status = randomStatus();
        f.statusAt = now;
        f.statusNext = 1 + Math.random() * 7;
        changed = true;
        if (f.id === activeFid) activeChanged = true;
      }
    });
    if (changed) {
      saveDB();
      if (activeChanged) updateChatHeader();
      if (profileIsMe === false && activeFriendId) renderProfile();
    }
    statusTimer = setTimeout(tickStatuses, 60000);
  }

  function importEmojiFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || '');
      var items;
      try {
        var data = JSON.parse(text);
        if (Array.isArray(data)) items = data.map(String);
        else if (data && Array.isArray(data.items)) items = data.items.map(String);
        else items = text.split(/\r?\n/);
      } catch (e) {
        items = text.split(/\r?\n/);
      }
      items = items.map(function (s) { return s.trim(); }).filter(Boolean);
      if (!items.length) { toast('文件里没有可导入的表情'); return; }
      var seen = {};
      var merged = $('#emojiItems').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean).concat(items).filter(function (s) {
        if (seen[s]) return false;
        seen[s] = true;
        return true;
      });
      $('#emojiItems').value = merged.join('\n');
      toast('已导入 ' + items.length + ' 个表情，记得保存');
    };
    reader.onerror = function () { toast('文件读取失败'); };
    reader.readAsText(file);
  }

  function shrinkStickerImage(file, cb) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 140;
      var scale = Math.min(1, max / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale));
      var h = Math.max(1, Math.round(img.height * scale));
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      var out;
      try { out = canvas.toDataURL('image/webp', 0.86); } catch (e) { out = canvas.toDataURL('image/png'); }
      cb(out);
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  function importEmojiImages(files) {
    var list = Array.prototype.slice.call(files || []);
    if (!list.length) return;
    var remain = list.length, added = 0;
    list.forEach(function (file) {
      shrinkStickerImage(file, function (src) {
        if (src) {
          var name = file.name.replace(/\.[^.]+$/, '').slice(0, 16) || '表情';
          editingEmojiImages.push({ src: src, name: name });
          added++;
        }
        if (--remain === 0) {
          renderEmojiImgList();
          toast(added ? '已导入 ' + added + ' 张图片，命名后记得保存' : '图片处理失败');
        }
      });
    });
  }

  function openCardEdit(c) {
    editingCard = c
      ? { id: c.id, title: c.title || '', content: c.content || '', groupId: c.groupId || null }
      : { id: null, title: '', content: '', groupId: libFilterGroup && libFilterGroup !== '__none__' && libFilterGroup !== '' ? libFilterGroup : null };
    $('#cardEditTitle').textContent = c ? '编辑字卡' : '新建字卡';
    $('#cardTitle').value = editingCard.title;
    $('#cardContent').value = editingCard.content;
    $('#cardDelete').classList.toggle('hidden', !c);
    renderCardGroupChips();
    openSheet('sheetCardEdit');
    setTimeout(function () { $('#cardContent').focus(); }, 280);

  function renderCardGroupChips() {
    var box = $('#cardGroupChips');
    var html = '<button class="chip' + (!editingCard.groupId ? ' active' : '') + '" data-gid="">未分组</button>';
    DB.cardGroups.forEach(function (g) {
      var active = editingCard.groupId === g.id ? ' active' : '';
      html += '<button class="chip' + active + '" data-gid="' + g.id + '"><span class="dot" style="background:' + g.color + '"></span>' + esc(g.name) + '</button>';
    });

  }

  function saveCard() {
    var title = $('#cardTitle').value.trim();
    var content = $('#cardContent').value.trim();
    if (!content) {
      toast('写点内容再保存');
      $('#cardContent').focus();
      return;
    }
    if (editingCard.id) {
      var c = cardById(editingCard.id);
      if (c) { c.title = title; c.content = content; c.groupId = editingCard.groupId; }
    } else {
      DB.cards.unshift({ id: uid('c_'), title: title, content: content, groupId: editingCard.groupId, disabled: false, createdAt: Date.now() });
    }
    saveDB();
    closeSheets();
    renderLibrary();
    renderCardPick();
    toast('已保存');
  }

  function deleteCard() {
    if (!editingCard || !editingCard.id) return;
    DB.cards = DB.cards.filter(function (c) { return c.id !== editingCard.id; });
    saveDB();
    closeSheets();
    renderLibrary();
    renderCardPick();
    toast('已删除');
  }

  function runDedup() {
    var seen = {};
    var before = DB.cards.length;
    DB.cards = DB.cards.filter(function (c) {
      var key = (c.content || '').trim();
      if (!key || seen[key]) return false;
      seen[key] = true;
      return true;
    });
    var removed = before - DB.cards.length;
    saveDB();
    renderLibrary();
    renderCardPick();
    toast(removed > 0 ? '已清理 ' + removed + ' 条重复字卡' : '没有重复字卡');
  }

  function exportCards() {
    var data = { cards: DB.cards, cardGroups: DB.cardGroups, exportedAt: new Date().toISOString() };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = '字卡库_' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('已导出 ' + DB.cards.length + ' 条字卡');
  }

  function importCards(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var data = JSON.parse(reader.result);
        var cards = Array.isArray(data) ? data : (data.cards || []);
        var groups = Array.isArray(data.cardGroups) ? data.cardGroups : [];
        if (!cards.length) { toast('文件中没有字卡'); return; }
        var idMap = {};
        groups.forEach(function (g) {
          var newId = uid('cg_');
          idMap[g.id] = newId;
          DB.cardGroups.push({ id: newId, name: g.name || '导入分组', color: g.color || randomColor(), disabled: !!g.disabled });
        });
        var added = 0;
        cards.forEach(function (c) {
          if (!c.content) return;
          DB.cards.unshift({
            id: uid('c_'),
            title: c.title || '',
            content: c.content,
            groupId: c.groupId && idMap[c.groupId] ? idMap[c.groupId] : null,
            disabled: !!c.disabled,
            createdAt: Date.now()
          });
          added++;
        });
        saveDB();
        renderLibrary();
        renderCardPick();
        toast('已导入 ' + added + ' 条字卡');
      } catch (e) {
        toast('导入失败：文件格式错误');
      }
    };
    reader.readAsText(file);
  }

  function renderGroupMgr() {
    var box = $('#groupMgrList');

        '<span class="gm-dot" style="background:' + g.color + '"></span>' +
        '<span class="gm-name">' + esc(g.name) + '</span>' +
        '<span class="gm-count">' + count + ' 条</span>' +
        '<div class="gm-actions">' +
        '<button data-act="toggle" title="' + (g.disabled ? '启用' : '屏蔽') + '">' + (g.disabled ? '👁' : '🚫') + '</button>' +
        '<button data-act="edit" title="编辑">' + PENCIL + '</button>' +

  function saveGroup() {

    if (!name) { toast('请输入分组名称'); $('#groupName').focus(); return; }
    if (editingGroup.id) {
      var g = cardGroupById(editingGroup.id);

  function deleteGroup() {
    if (!editingGroup || !editingGroup.id) return;
    var gid = editingGroup.id;
    DB.cardGroups = DB.cardGroups.filter(function (g) { return g.id !== gid; });
    DB.cards.forEach(function (c) { if (c.groupId === gid) c.groupId = null; });
    saveDB();
    closeSheets();
    renderGroupMgr();
    renderLibrary();
    renderCardPick();
    toast('分组已删除，字卡保留');

  function batchSetGroup(gid) {
    var ids = Object.keys(libSelected);
    if (!ids.length) return;
    ids.forEach(function (id) {
      var c = cardById(id);
      if (c) c.groupId = gid || null;
    });
    saveDB();
    libSelected = {};
    renderLibrary();
    renderCardPick();
    toast('已更新 ' + ids.length + ' 张字卡的分组');
  }

  function batchToggleDisable() {
    var ids = Object.keys(libSelected);
    if (!ids.length) return;
    var anyEnabled = ids.some(function (id) { var c = cardById(id); return c && !c.disabled; });
    ids.forEach(function (id) {
      var c = cardById(id);
      if (c) c.disabled = anyEnabled;
    });
    saveDB();
    libSelected = {};
    renderLibrary();
    toast(anyEnabled ? '已屏蔽选中字卡' : '已启用选中字卡');
  }

  function batchDelete() {
    var ids = Object.keys(libSelected);
    if (!ids.length) return;
    if (!confirm('删除选中的 ' + ids.length + ' 张字卡？')) return;
    DB.cards = DB.cards.filter(function (c) { return !libSelected[c.id]; });
    libSelected = {};
    saveDB();
    renderLibrary();
    renderCardPick();
    toast('已删除');
  }

    $('#emojiGroupSave').addEventListener('click', saveEmojiGroup);
    $('#emojiGroupDelete').addEventListener('click', deleteEmojiGroup);
    $('#emojiImportFile').addEventListener('change', function () {
      var f = this.files && this.files[0];
      if (f) importEmojiFile(f);
      this.value = '';
    });
    $('#emojiImgFile').addEventListener('change', function () {
      importEmojiImages(this.files);
      this.value = '';
    });
    $('#emojiImgList').addEventListener('input', function (e) {
      var inp = e.target.closest('.emoji-img-name');
      if (!inp) return;
      var it = editingEmojiImages[+inp.dataset.idx];
      if (it) it.name = inp.value;
    });
    $('#emojiImgList').addEventListener('click', function (e) {
      var del = e.target.closest('.emoji-img-del');
      if (!del) return;
      editingEmojiImages.splice(+del.dataset.idx, 1);
      renderEmojiImgList();
    });

    /* 全局设置 */
    $('#swTyping').addEventListener('click', function () {
      DB.settings.typingIndicatorEnabled = !DB.settings.typingIndicatorEnabled;
      this.classList.toggle('active', DB.settings.typingIndicatorEnabled);
      saveDB();
    });
    $('#delayMin').addEventListener('change', function () {
      var v = parseInt(this.value) || 0;
      DB.settings.replyDelayMin = Math.max(0, v);
      if (DB.settings.replyDelayMin > DB.settings.replyDelayMax) DB.settings.replyDelayMax = DB.settings.replyDelayMin;
      saveDB();
    });
    $('#delayMax').addEventListener('change', function () {
      var v = parseInt(this.value) || 0;
      DB.settings.replyDelayMax = Math.max(DB.settings.replyDelayMin, v);
      this.value = DB.settings.replyDelayMax;
      saveDB();
    });
    $$('.delay-presets button').forEach(function (b) {
      b.addEventListener('click', function () {
        var parts = this.dataset.preset.split(',');
        DB.settings.replyDelayMin = parseInt(parts[0]);
        DB.settings.replyDelayMax = parseInt(parts[1]);
        $('#delayMin').value = DB.settings.replyDelayMin;
        $('#delayMax').value = DB.settings.replyDelayMax;
        saveDB();
        toast('已应用');
      });
    });

    /* 自动回复开关 */
    $('#swAutoReply').addEventListener('click', function () {
      var g = groupById(activeGroupId);
      if (!g || g.memberIds.length !== 1) return;
      var f = friendById(g.memberIds[0]);
      if (!f) return;
      f.autoReply = !f.autoReply;
      this.classList.toggle('active', f.autoReply);
      saveDB();
      toast(f.autoReply ? '已开启自动回复' : '已关闭自动回复');
    });

    /* 好友资料 */
    $('#profileBack').addEventListener('click', function () { closeScreen('pageProfile'); });
    $('#profileEdit').addEventListener('click', function () {
      if (profileIsMe) openMyEdit();
      else openFriendEdit(friendById(activeFriendId));
    });
    $('#profileMore').addEventListener('click', function () { toast('更多功能待开发'); });
    $('#profileAvatar').addEventListener('click', function () { $('#profileAvatarFile').click(); });
    $('#profileAvatarFile').addEventListener('change', function () {
      var file = this.files && this.files[0];
      if (!file) return;
      shrinkImage(file, function (data) {
        if (!data) { toast('图片处理失败'); return; }
        if (profileIsMe) {
          DB.me.avatar = data;
          saveDB();
          renderProfile();
          renderMessages();
          toast('头像已更新');
          return;
        }
        var f = friendById(activeFriendId);
        if (!f) { toast('图片处理失败'); return; }
        f.avatar = data;
        saveDB();
        renderProfile();
        renderContacts();
        renderChatList();
        toast('头像已更新');
      });
      this.value = '';
    });
    $('#profileRegionRow').addEventListener('click', openRegionSheet);
    $('#regionSave').addEventListener('click', saveRegion);
    $('#profileChat').addEventListener('click', function () {
      if (profileIsMe) return;
      var gid = findOrCreateSingle(activeFriendId);
      closeScreen('pageProfile');
      renderChatList();
      openChat(gid);
    });
    $('#profileCall').addEventListener('click', function () {
      if (profileIsMe) return;
      var gid = findOrCreateSingle(activeFriendId);
      renderChatList();
      openCallOptions(gid);
    });
  }

  /* ================= 启动 ================= */
  function initSplash() {
    var splash = $('#splash');
    setTimeout(function () {
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 360);
    }, 2000);
  }

  function fitPhone() {
    var phone = $('#phone');
    if (window.innerWidth <= 520) {
      phone.style.transform = '';
      return;
    }
    var scale = Math.min(1, (window.innerHeight - 24) / 844, (window.innerWidth - 24) / 390);
    phone.style.transform = 'scale(' + scale + ')';
    phone.style.transformOrigin = 'center center';
  }

  function init() {
    $('#batteryNum').textContent = Math.round(72 + Math.random() * 18);
    clockLoop();
    renderChatList();
    renderContacts();
    bindEvents();
    fitPhone();
    window.addEventListener('resize', fitPhone);
    initSplash();
    tickStatuses();
  }

  init();
})();

</script>
</body>
</html>
